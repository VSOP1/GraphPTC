[model]
model = "mimo-v2.5"
base_url = "https://api.xiaomimimo.com/v1"
api_key_env = "MIMO_API_KEY"
max_completion_tokens = 4096
thinking = "disabled"
timeout_seconds = 300.0
max_retries = 3
temperature = 0.0

[runtime]
max_turns = 40
max_ptc_blocks = 39
task_timeout_seconds = 480.0
code_timeout_seconds = 60.0
max_stdout_chars = 8000
finalization_max_tokens = 2048
max_compactions = 0
graph_adaptation_mode = "generic"

[agent_diff]
root = "{repo}/external/agent_diff"
worker_command = [
  "{repo}/external/agent_diff/.venv/bin/python",
  "{repo}/src/graphptc/benchmarks/agent_diff/worker.py",
]
dataset_dir = "data/agent_diff"
dataset_split = "all"
results_path = "runs/agent_diff/graphptc/results.jsonl"
report_path = "runs/agent_diff/graphptc/report.json"
artifact_dir = "runs/agent_diff/graphptc/artifacts"
graph_dir = "runs/agent_diff/graphptc/graphs"
progress_path = "runs/agent_diff/graphptc/progress.jsonl"
workers = 5
expected_tasks = 224
trials = 3
prompt_variant = "agent-diff-ptc-fewshot"
documentation_condition = "no-docs"
official_commit = "3bb9c40707df23d89e5dbc0e40c424ba38c69ff8"
api_key_env = "AGENT_DIFF_API_KEY"
base_url_env = "AGENT_DIFF_BASE_URL"

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: diff_the_universe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - agent_diff_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: >
      postgres -c wal_level=logical -c max_replication_slots=10 -c max_wal_senders=10

  backend:
    build:
      context: ${AGENT_DIFF_OFFICIAL_ROOT}/backend
      dockerfile: Dockerfile.local
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/diff_the_universe
      LOGICAL_REPLICATION_ENABLED: "false"
      ENVIRONMENT: development
      SEED: "true"
    volumes:
      - ${AGENT_DIFF_OFFICIAL_ROOT}/backend:/app
      - ${AGENT_DIFF_OFFICIAL_ROOT}/sdk:/sdk
    command: >
      sh -c "
        alembic upgrade head &&
        echo '=== Seeding database ===' &&
        python utils/seed_slack_template.py &&
        python utils/seed_linear_template.py &&
        python utils/seed_box_template.py &&
        python utils/seed_calendar_template.py &&
        python utils/seed_github_template.py &&
        python utils/seed_tests.py &&
        uvicorn src.platform.api.main:app --host 0.0.0.0 --port 8000
      "

volumes:
  agent_diff_postgres_data:

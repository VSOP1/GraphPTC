[model]
model = "mimo-v2.5"
base_url = "https://api.xiaomimimo.com/v1"
api_key_env = "MIMO_API_KEY"
max_completion_tokens = 4096
thinking = "disabled"
timeout_seconds = 300.0
max_retries = 3
temperature = 0.0

[runtime]
max_turns = 40
max_ptc_blocks = 39
task_timeout_seconds = 480.0
code_timeout_seconds = 60.0
max_stdout_chars = 8000
finalization_max_tokens = 2048
max_compactions = 0
graph_adaptation_mode = "off"
graph_inspection_enabled = false

[agent_diff]
root = "/home/agent/graphptc-agent-diff"
worker_command = [
  "wsl.exe",
  "-d",
  "Ubuntu-22.04",
  "-e",
  "/home/agent/graphptc-agent-diff/.venv/bin/python",
  "/mnt/d/GraphPTC/src/graphptc/agentdiff_worker.py",
]
dataset_dir = "data/agent_diff"
dataset_split = "train"
results_path = "runs/agent_diff/fewshot-ptc-smoke/results.jsonl"
report_path = "runs/agent_diff/fewshot-ptc-smoke/report.json"
artifact_dir = "runs/agent_diff/fewshot-ptc-smoke/artifacts"
graph_dir = "runs/agent_diff/fewshot-ptc-smoke/graphs"
progress_path = "runs/agent_diff/fewshot-ptc-smoke/progress.jsonl"
workers = 4
expected_tasks = 179
trials = 1
prompt_variant = "agent-diff-ptc-fewshot"
documentation_condition = "no-docs"
official_commit = "3bb9c40707df23d89e5dbc0e40c424ba38c69ff8"
api_key_env = "AGENT_DIFF_API_KEY"
base_url_env = "AGENT_DIFF_BASE_URL"

[model]
model = "mimo-v2.5"
base_url = "https://api.xiaomimimo.com/v1"
api_key_env = "MIMO_API_KEY"
max_completion_tokens = 4096
thinking = "disabled"
timeout_seconds = 300.0
max_retries = 8
temperature = 0.0

[runtime]
max_turns = 30
max_ptc_blocks = 29
task_timeout_seconds = 1800.0
code_timeout_seconds = 100.0
max_stdout_chars = 8000
finalization_max_tokens = 2048
compaction_max_tokens = 2048
max_compactions = 0
max_total_output_tokens = 61440
graph_adaptation_mode = "generic"
graph_inspection_enabled = false

[alfworld]
data_root = "/home/agent/.cache/alfworld"
official_config_path = "/mnt/d/GraphPTC/configs/alfworld/official-eval-0.4.2.yaml"
split = "eval_in_distribution"
worker_command = ["wsl.exe", "-d", "Ubuntu-22.04", "-e", "/home/agent/graphptc-alfworld/.venv/bin/python", "/mnt/d/GraphPTC/src/graphptc/alfworld_worker.py"]
results_path = "runs/alfworld/smoke-move-grammar/graphptc/results.jsonl"
report_path = "runs/alfworld/smoke-move-grammar/graphptc/report.json"
graph_dir = "runs/alfworld/smoke-move-grammar/graphptc/graphs"
workers = 3
expected_tasks = 140
seed = 42
max_steps = 50
prompt_variant = "alfworld-ptc-fewshot"
official_version = "0.4.2"

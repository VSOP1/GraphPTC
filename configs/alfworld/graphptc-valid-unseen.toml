[model]
model = "mimo-v2.5"
base_url = "https://api.xiaomimimo.com/v1"
api_key_env = "MIMO_API_KEY"
max_completion_tokens = 4096
thinking = "disabled"
timeout_seconds = 300.0
max_retries = 8
temperature = 0.0

[runtime]
max_turns = 30
max_ptc_blocks = 29
task_timeout_seconds = 1800.0
code_timeout_seconds = 100.0
max_stdout_chars = 8000
finalization_max_tokens = 2048
compaction_max_tokens = 2048
max_compactions = 0
max_total_output_tokens = 61440
graph_adaptation_mode = "generic"

[alfworld]
data_root = "{repo}/external/alfworld/data"
official_config_path = "{repo}/configs/alfworld/official-eval-0.4.2.yaml"
split = "eval_out_of_distribution"
worker_command = ["{repo}/external/alfworld/.venv/bin/python", "{repo}/src/graphptc/benchmarks/alfworld/worker.py"]
results_path = "runs/alfworld/valid-unseen/graphptc/results.jsonl"
report_path = "runs/alfworld/valid-unseen/graphptc/report.json"
graph_dir = "runs/alfworld/valid-unseen/graphptc/graphs"
workers = 3
expected_tasks = 134
seed = 42
max_steps = 50
prompt_variant = "alfworld-ptc-fewshot"
official_version = "0.4.2"

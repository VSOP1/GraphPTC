[model]
model = "mimo-v2.5"
base_url = "https://api.xiaomimimo.com/v1"
api_key_env = "MIMO_API_KEY"
max_completion_tokens = 32000
thinking = "enabled"
timeout_seconds = 600.0
max_retries = 8

[search]
api_key_env = "TAVILY_API_KEY"
search_depth = "advanced"
max_results = 10
max_tool_calls = 1000
timeout_seconds = 60.0

[browsecomp_plus]
source_browsecomp_path = "data/browse_comp_test_set.csv"
corpus_dir = "data/browsecomp_plus/corpus_parquet"
index_path = "data/browsecomp_plus/corpus.sqlite3"
qrels_gold_path = "data/browsecomp_plus/qrel_golds.txt"
qrels_evidence_path = "data/browsecomp_plus/qrel_evidence.txt"
top_k = 5
snippet_max_chars = 2048
max_tool_calls = 1000

[runtime]
max_turns = 100
max_ptc_blocks = 100
task_timeout_seconds = 3600.0
code_timeout_seconds = 300.0
max_stdout_chars = 60000

[benchmark]
dataset_path = "data/browsecomp_plus/questions.jsonl"
responses_path = "runs/browsecomp_plus/graphptc-stage1/responses.jsonl"
grades_path = "runs/browsecomp_plus/graphptc-stage1/grades.jsonl"
report_path = "runs/browsecomp_plus/graphptc-stage1/report.json"
workers = 1

[grader]
provider = "openai_compatible"
model = "mimo-v2.5"
base_url = "https://api.xiaomimimo.com/v1"
api_key_env = "MIMO_API_KEY"
workers = 5
max_retries = 2
max_completion_tokens = 1024
thinking = "disabled"
timeout_seconds = 120.0

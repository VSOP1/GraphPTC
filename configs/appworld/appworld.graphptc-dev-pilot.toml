[model]
model = "mimo-v2.5"
base_url = "https://api.xiaomimimo.com/v1"
api_key_env = "MIMO_API_KEY"
max_completion_tokens = 4096
thinking = "disabled"
timeout_seconds = 300.0
max_retries = 8
temperature = 0.0

[runtime]
max_turns = 30
max_ptc_blocks = 29
task_timeout_seconds = 1800.0
code_timeout_seconds = 100.0
max_stdout_chars = 8000
finalization_max_tokens = 2048
compaction_max_tokens = 2048
max_compactions = 0
max_total_output_tokens = 61440
graph_adaptation_mode = "generic"

[appworld]
root = "/home/agent/graphptc-appworld"
dataset_name = "dev"
experiment_name = "graphptc-dev-pilot"
worker_command = [
  "wsl.exe",
  "-d",
  "Ubuntu-22.04",
  "-e",
  "/home/agent/graphptc-appworld/.venv/bin/python",
  "/mnt/d/GraphPTC/src/graphptc/appworld_worker.py",
]
results_path = "runs/appworld/graphptc-dev-pilot/results.jsonl"
report_path = "runs/appworld/graphptc-dev-pilot/report.json"
graph_dir = "runs/appworld/graphptc-dev-pilot/graphs"
workers = 2
expected_tasks = 56
prompt_variant = "appworld-general"

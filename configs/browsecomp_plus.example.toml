[model]
model = "mimo-v2.5"
base_url = "https://api.xiaomimimo.com/v1"
api_key_env = "MIMO_API_KEY"
max_completion_tokens = 2048
thinking = "disabled"
timeout_seconds = 300.0
max_retries = 8
temperature = 0.0

[search]
# Unused for BrowseComp-Plus; retained for the shared experiment schema.
api_key_env = "TAVILY_API_KEY"
search_depth = "advanced"
max_results = 10
max_tool_calls = 1000
timeout_seconds = 60.0

[browsecomp_plus]
source_browsecomp_path = "data/browse_comp_test_set.csv"
corpus_dir = "data/browsecomp_plus/corpus_parquet"
index_path = "data/browsecomp_plus/corpus.sqlite3"
qrels_gold_path = "data/browsecomp_plus/qrel_golds.txt"
qrels_evidence_path = "data/browsecomp_plus/qrel_evidence.txt"
retriever_url = "http://127.0.0.1:8765"
retriever_timeout_seconds = 60.0
top_k = 5
# The official service truncates each search hit with the pinned Qwen tokenizer.
snippet_max_tokens = 512
# Retained only for the historical SQLite/GraphPTC development adapter.
snippet_max_chars = 2048
max_tool_calls = 1000
expected_examples = 830
prompt_variant = "original-ptc-v1"

[runtime]
max_turns = 30
max_ptc_blocks = 29
task_timeout_seconds = 1800.0
code_timeout_seconds = 120.0
max_stdout_chars = 4000
finalization_max_tokens = 2048
compaction_max_tokens = 2048
max_compactions = 0
max_total_output_tokens = 61440

[benchmark]
dataset_path = "data/browsecomp_plus/questions.jsonl"
responses_path = "runs/browsecomp_plus/original-ptc-v1-turn30-full/responses.jsonl"
grades_path = "runs/browsecomp_plus/original-ptc-v1-turn30-full/grades.jsonl"
report_path = "runs/browsecomp_plus/original-ptc-v1-turn30-full/report.json"
workers = 4

[grader]
provider = "openai_compatible"
model = "mimo-v2.5"
base_url = "https://api.xiaomimimo.com/v1"
api_key_env = "MIMO_API_KEY"
workers = 5
max_retries = 2
max_completion_tokens = 1024
thinking = "disabled"
timeout_seconds = 120.0

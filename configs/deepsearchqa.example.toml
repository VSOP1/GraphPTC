[model]
model = "mimo-v2.5"
base_url = "https://api.xiaomimimo.com/v1"
api_key_env = "MIMO_API_KEY"
max_completion_tokens = 32000
thinking = "enabled"
timeout_seconds = 600.0
max_retries = 8

[search]
api_key_env = "TAVILY_API_KEY"
search_depth = "advanced"
max_results = 10
max_tool_calls = 1000
timeout_seconds = 60.0

[runtime]
max_turns = 100
# This is a safety ceiling, not a prescribed PTC count. The agent chooses the count per task.
max_ptc_blocks = 100
task_timeout_seconds = 3600.0
code_timeout_seconds = 300.0
max_stdout_chars = 60000

[benchmark]
dataset_path = "data/DSQA-full.csv"
responses_path = "runs/deepsearchqa/official-style/responses.jsonl"
grades_path = "runs/deepsearchqa/official-style/grades.jsonl"
report_path = "runs/deepsearchqa/official-style/report.json"
workers = 1

[grader]
provider = "openai_compatible"
model = "mimo-v2.5"
base_url = "https://api.xiaomimimo.com/v1"
api_key_env = "MIMO_API_KEY"
workers = 5
max_retries = 2
max_completion_tokens = 8000
thinking = "disabled"
timeout_seconds = 120.0

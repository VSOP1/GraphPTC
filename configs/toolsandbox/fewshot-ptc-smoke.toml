[model]
model = "mimo-v2.5"
base_url = "https://api.xiaomimimo.com/v1"
api_key_env = "MIMO_API_KEY"
max_completion_tokens = 4096
thinking = "disabled"
timeout_seconds = 300.0
max_retries = 3
temperature = 0.0

[runtime]
max_turns = 30
max_ptc_blocks = 29
task_timeout_seconds = 1800.0
code_timeout_seconds = 300.0
max_stdout_chars = 8000
finalization_max_tokens = 2048
max_compactions = 0
graph_adaptation_mode = "off"
graph_inspection_enabled = false

[toolsandbox]
root = "/home/agent/graphptc-toolsandbox"
worker_command = [
  "wsl.exe",
  "-d",
  "Ubuntu-22.04",
  "-e",
  "/home/agent/graphptc-toolsandbox/.venv/bin/python",
  "/mnt/d/GraphPTC/src/graphptc/toolsandbox_worker.py",
]
results_path = "runs/toolsandbox/fewshot-ptc-smoke/results.jsonl"
report_path = "runs/toolsandbox/fewshot-ptc-smoke/report.json"
artifact_dir = "runs/toolsandbox/fewshot-ptc-smoke/artifacts"
graph_dir = "runs/toolsandbox/fewshot-ptc-smoke/graphs"
workers = 1
expected_scenarios = 1032
tool_backend = "default"
prompt_variant = "toolsandbox-ptc-fewshot"

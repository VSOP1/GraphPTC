[model]
model = "mimo-v2.5"
base_url = "https://api.xiaomimimo.com/v1"
api_key_env = "MIMO_API_KEY"
max_completion_tokens = 4096
thinking = "disabled"
timeout_seconds = 300.0
max_retries = 8
temperature = 0.0

[runtime]
max_turns = 30
max_ptc_blocks = 29
task_timeout_seconds = 1800.0
code_timeout_seconds = 120.0
max_stdout_chars = 8000
finalization_max_tokens = 2048
compaction_max_tokens = 2048
max_compactions = 0
max_total_output_tokens = 61440
graph_adaptation_mode = "off"
graph_inspection_enabled = false

[grader]
provider = "openai_compatible"
model = "mimo-v2.5"
base_url = "https://api.xiaomimimo.com/v1"
api_key_env = "MIMO_API_KEY"
workers = 5
max_retries = 2
max_completion_tokens = 8000
thinking = "disabled"
timeout_seconds = 120.0

[frames]
dataset_path = "data/frames/test.tsv"
dataset_revision = "58d9fb6330f3ab1316d1eca12e5e8ef23dcc22ef"
corpus_snapshot = "wikipedia/20230601.en"
retriever_base_url = "http://localhost:8890"
search_results = 10
max_search_calls = 25
expected_tasks = 824
workers = 4
results_path = "runs/frames/test/fewshot-ptc/results.jsonl"
grades_path = "runs/frames/test/fewshot-ptc/grades.jsonl"
report_path = "runs/frames/test/fewshot-ptc/report.json"
artifact_dir = "runs/frames/test/fewshot-ptc/artifacts"
graph_dir = "runs/frames/test/fewshot-ptc/graphs"
prompt_variant = "frames-ptc-official-planning-fewshot"

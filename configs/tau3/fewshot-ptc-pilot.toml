[model]
model = "mimo-v2.5"
base_url = "https://api.xiaomimimo.com/v1"
api_key_env = "MIMO_API_KEY"
max_completion_tokens = 32000
thinking = "disabled"
timeout_seconds = 600
max_retries = 8
temperature = 0.0

[runtime]
max_turns = 100
max_ptc_blocks = 100
task_timeout_seconds = 3600
code_timeout_seconds = 300
max_stdout_chars = 8000
graph_adaptation_mode = "off"
graph_inspection_enabled = false

[tau3]
root = "/home/agent/graphptc-tau3-bench"
worker_command = ["wsl.exe", "-d", "Ubuntu-22.04", "--", "/home/agent/graphptc-tau3-bench/.venv/bin/python", "/mnt/d/GraphPTC/src/graphptc/tau3_worker.py"]
results_path = "runs/tau3/pilot/fewshot-ptc/results.jsonl"
report_path = "runs/tau3/pilot/fewshot-ptc/report.json"
artifact_dir = "runs/tau3/pilot/fewshot-ptc/artifacts"
graph_dir = "runs/tau3/pilot/fewshot-ptc/graphs"
progress_path = "runs/tau3/pilot/fewshot-ptc/progress.jsonl"
domains = ["airline", "retail", "telecom"]
task_split_name = "base"
trials = 4
workers = 3
max_steps = 200
max_errors = 10
seed = 300
enforce_communication_protocol = false
task_max_retries = 3
retry_delay_seconds = 1.0
prompt_variant = "tau3-ptc-fewshot"
official_commit = "fc0055dc4e0a316c3f83133267fbd6faaa770992"
user_model = "openai/mimo-v2.5"
user_api_key_env = "MIMO_API_KEY"
user_base_url = "https://api.xiaomimimo.com/v1"
